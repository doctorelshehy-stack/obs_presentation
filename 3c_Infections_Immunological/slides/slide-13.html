<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; display:flex; justify-content:center; align-items:center; background:#000; }
.slide-content { width:960px; height:540px; position:relative; transform-origin:center center; }
</style>
<script>
function scaleSlide(){const s=document.querySelector('.slide-content');if(!s)return;const sx=window.innerWidth/960;const sy=window.innerHeight/540;const sc=Math.min(sx,sy);s.style.width='960px';s.style.height='540px';s.style.transform=`scale(${sc})`;s.style.transformOrigin='center center';s.style.flexShrink='0';}
window.addEventListener('load',scaleSlide);window.addEventListener('resize',scaleSlide);
</script>
</head>
<body>
<div class="slide-content" style="background:#f0f5f5;width:960px;height:540px;overflow:hidden;font-family:'Times New Roman',serif;">
<div style="position:absolute;top:0;left:0;width:960px;height:540px;background:#264653;"></div>
<div style="position:absolute;top:0;left:0;width:12px;height:540px;background:#2a9d8f;"></div>
<p style="position:absolute;top:120px;left:60px;font-size:96px;font-weight:700;color:#2a9d8f;opacity:0.3;margin:0;">02</p>
<p style="position:absolute;top:180px;left:60px;font-size:42px;font-weight:700;color:#ffffff;margin:0;">RH Incompatibility</p>
<p style="position:absolute;top:260px;left:60px;right:60px;font-size:18px;color:#264653;opacity:0.85;line-height:1.5;">Definition • Etiology • Pathogenesis • Management • ABO Incompatibility • Hydrops Fetalis</p>
<svg style="position:absolute;right:32px;bottom:24px;width:36px;height:36px;z-index:100;" aria-hidden="true">
  <rect x="0" y="0" width="36" height="36" rx="18" fill="#2a9d8f" />
  <text x="18" y="25" text-anchor="middle" font-family="'Times New Roman',serif" font-size="16" font-weight="700" fill="#ffffff">13</text>
</svg>
</div>
</body>
</html>
