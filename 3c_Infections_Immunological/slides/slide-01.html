<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; display:flex; justify-content:center; align-items:center; background:#000; }
.slide-content { width:960px; height:540px; position:relative; transform-origin:center center; }
</style>
<script>
function scaleSlide(){const s=document.querySelector('.slide-content');if(!s)return;const sx=window.innerWidth/960;const sy=window.innerHeight/540;const sc=Math.min(sx,sy);s.style.width='960px';s.style.height='540px';s.style.transform=`scale(${sc})`;s.style.transformOrigin='center center';s.style.flexShrink='0';}
window.addEventListener('load',scaleSlide);window.addEventListener('resize',scaleSlide);
</script>
</head>
<body>
<div class="slide-content" style="background:#f0f5f5;width:960px;height:540px;overflow:hidden;font-family:'Times New Roman',serif;">
<div style="position:absolute;top:0;left:0;width:960px;height:540px;background:linear-gradient(135deg,#264653 0%,#1a3a3a 100%);"></div>
<div style="position:absolute;top:0;left:0;width:960px;height:540px;background:radial-gradient(ellipse at 80% 40%,rgba(42,157,143,0.15) 0%,transparent 60%);"></div>
<!-- Decorative shapes -->
<svg style="position:absolute;top:0;left:0;width:960px;height:540px;" aria-hidden="true">
  <rect x="0" y="0" width="8" height="540" fill="#2a9d8f" />
  <circle cx="860" cy="80" r="120" fill="none" stroke="#2a9d8f" stroke-width="1" opacity="0.15" />
  <circle cx="880" cy="100" r="80" fill="none" stroke="#e9c46a" stroke-width="0.5" opacity="0.1" />
</svg>
<!-- Gold accent bar -->
<div style="position:absolute;top:120px;left:70px;width:80px;height:5px;background:#e9c46a;border-radius:2.5px;"></div>
<!-- First heading line -->
<p style="position:absolute;top:120px;left:70px;font-size:30px;font-weight:400;color:#ffffff;opacity:0.8;margin:0;">Medical Obstetric Disorders</p>
<!-- Main title -->
<p style="position:absolute;top:175px;left:70px;right:60px;font-size:52px;font-weight:700;color:#2a9d8f;margin:0;line-height:1.15;">Infectious Diseases<br>with Pregnancy &amp;<br>RH Incompatibility</p>
<!-- Subtitle -->
<p style="position:absolute;top:340px;left:70px;font-size:18px;color:#ffffff;opacity:0.7;margin:0;">A Comprehensive Obstetric Reference Presentation</p>
<!-- Supporting text -->
<p style="position:absolute;top:380px;left:70px;font-size:16px;color:#ffffff;opacity:0.4;margin:0;">Based on Standard Obstetric Curriculum • TORCH Infections • RH Isoimmunization</p>
<div style="position:absolute;bottom:40px;left:70px;right:60px;border-top:1px solid rgba(255,255,255,0.1);padding-top:12px;">
<p style="font-size:14px;color:#ffffff;opacity:0.3;margin:0;">Source: 17_Infectious_Diseases_with_Pregnancy.pdf • 45_RH_Incompatibility.pdf</p>
</div>

</div>
</body>
</html>
