<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slide</title>
<style>
html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; display:flex; justify-content:center; align-items:center; background:#000; }
.slide-content { width:960px; height:540px; position:relative; transform-origin:center center; }
</style>
<script>
function scaleSlide(){const s=document.querySelector('.slide-content');if(!s)return;const sx=window.innerWidth/960;const sy=window.innerHeight/540;const sc=Math.min(sx,sy);s.style.width='960px';s.style.height='540px';s.style.transform='scale('+sc+')';s.style.transformOrigin='center center';s.style.flexShrink='0';}
window.addEventListener('load',scaleSlide);window.addEventListener('resize',scaleSlide);
</script>
</head>
<body>
<div class="slide-content" style="width:960px;height:540px;background:#ffffff;overflow:hidden;position:relative;font-family:'Times New Roman',serif;">
<div style="position:absolute; top:0; left:0; width:960px; height:540px; background:#edf2f4;"></div>
<div style="position:absolute; top:0; left:0; width:960px; height:540px;">
<svg width="960" height="540" aria-hidden="true">
  <rect x="0" y="0" width="960" height="540" fill="#edf2f4"/>
  <circle cx="-40" cy="-40" r="200" fill="#2a9d8f" opacity="0.12"/>
  <circle cx="900" cy="480" r="180" fill="#e76f51" opacity="0.10"/>
  <circle cx="480" cy="270" r="120" fill="#e9c46a" opacity="0.08"/>
  <rect x="0" y="532" width="960" height="8" fill="#2a9d8f"/>
  <rect x="70" y="110" width="80" height="5" fill="#e9c46a"/>
</svg>
</div>
<div style="position:absolute; top:70px; left:80px; width:500px;">
  <p style="font-size:28px; color:#2a9d8f; margin:0; font-weight:400; letter-spacing:2px;">3_Medical_Obstetric_Disorders</p>
  <p style="font-size:52px; color:#264653; margin:20px 0 0 0; font-weight:700; line-height:1.1;">Multiple Pregnancy,<br>Preterm Labor &amp;<br>Premature Rupture of Membranes</p>
  <div style="width:80px; height:4px; background:#2a9d8f; margin:24px 0; border-radius:2px;"></div>
  <p style="font-size:20px; color:#e76f51; margin:0; font-weight:400;">Obstetrics &amp; Gynecology — Study Material</p>
  <p style="font-size:16px; color:#264653; margin:12px 0 0 0; opacity:0.6;">Comprehensive Lecture Notes — Full Content Preserved</p>
</div>
<div style="position:absolute; right:60px; bottom:60px; width:300px; height:200px; border-radius:12px; overflow:hidden; opacity:0.9;">
  <img src="imgs/cover.png" alt="Cover illustration" style="width:100%; height:100%; object-fit:cover; border-radius:12px; border:2px solid #2a9d8f;">
</div></div>
</body>
</html>
