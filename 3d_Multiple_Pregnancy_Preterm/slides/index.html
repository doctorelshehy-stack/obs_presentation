<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Obstetric Disorders Presentation</title>
<style>
body { font-family: 'Times New Roman', serif; background: #1a1a2e; margin: 0; padding: 20px; color: #fff; }
h1 { text-align: center; color: #2a9d8f; font-size: 28px; margin-bottom: 5px; }
h2 { text-align: center; color: #e9c46a; font-size: 16px; font-weight: 400; margin-top: 0; margin-bottom: 20px; }
.slides-nav { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 20px; }
.slides-nav a { display: inline-block; padding: 6px 14px; background: #2a9d8f; color: #fff; text-decoration: none; border-radius: 4px; font-size: 13px; transition: background 0.2s; }
.slides-nav a:hover { background: #264653; }
.slides-nav a.section { background: #e76f51; font-weight: 700; }
iframe { display: block; margin: 0 auto; width: 960px; height: 540px; border: none; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); max-width: 100%; }
.nav-controls { text-align: center; margin-top: 15px; }
.nav-controls button { padding: 8px 24px; margin: 0 10px; font-size: 16px; background: #2a9d8f; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
.nav-controls button:hover { background: #264653; }
.nav-controls span { font-size: 16px; color: #e9c46a; }
#slide-counter { text-align: center; margin-top: 8px; color: rgba(255,255,255,0.6); font-size: 14px; }
</style>
</head>
<body>
<h1>Multiple Pregnancy, Preterm Labor &amp; Premature Rupture of Membranes</h1>
<h2>Obstetrics &amp; Gynecology — Complete Lecture Notes (22 Slides)</h2>

<div class="slides-nav" id="slide-links"></div>

<iframe id="slide-frame" src="slide-01.html"></iframe>

<div class="nav-controls">
  <button onclick="prevSlide()">◀ Previous</button>
  <span id="slide-label">1 / 22</span>
  <button onclick="nextSlide()">Next ▶</button>
</div>
<p id="slide-counter">Use arrow keys ← → to navigate</p>

<script>
const TOTAL = 22;
let current = 1;

function updateSlide() {
  document.getElementById('slide-frame').src = `slide-${String(current).padStart(2, '0')}.html`;
  document.getElementById('slide-label').textContent = `${current} / ${TOTAL}`;
  document.querySelectorAll('.slides-nav a').forEach(a => {
    a.style.background = a.dataset.num == current ? '#e76f51' : '';
  });
}

function nextSlide() { if (current < TOTAL) { current++; updateSlide(); } }
function prevSlide() { if (current > 1) { current--; updateSlide(); } }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') nextSlide();
  if (e.key === 'ArrowLeft') prevSlide();
});

// Generate nav links
const nav = document.getElementById('slide-links');
const sections = [1, 3, 11, 17];  // slide numbers where sections start
for (let i = 1; i <= TOTAL; i++) {
  const a = document.createElement('a');
  a.href = `slide-${String(i).padStart(2, '0')}.html`;
  a.textContent = i;
  a.dataset.num = i;
  a.onclick = e => { e.preventDefault(); current = i; updateSlide(); };
  if (sections.includes(i)) a.className = 'section';
  nav.appendChild(a);
}
</script>
</body>
</html>
