<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; display:flex; justify-content:center; align-items:center; background:#000; }
.slide-content { width:960px; height:540px; position:relative; transform-origin:center center; }
</style>
<script>
function scaleSlide(){const s=document.querySelector('.slide-content');if(!s)return;const sx=window.innerWidth/960;const sy=window.innerHeight/540;const sc=Math.min(sx,sy);s.style.width='960px';s.style.height='540px';s.style.transform=`scale(${sc})`;s.style.transformOrigin='center center';s.style.flexShrink='0';}
window.addEventListener('load',scaleSlide);window.addEventListener('resize',scaleSlide);
</script></head>
<body>
<div class="slide-content" style="background:#03045e;font-family:"Times New Roman", serif;overflow:hidden;">
<svg style="position:absolute;top:0;left:0;width:960px;height:540px;" aria-hidden="true">
<circle cx="800" cy="100" r="200" fill="#0077b6" opacity="0.15"/>
<circle cx="150" cy="450" r="150" fill="#00b4d8" opacity="0.12"/>
<rect x="60" y="200" width="6" height="120" fill="#00b4d8" rx="3"/>
</svg>
<div style="position:absolute;top:80px;left:100px;font-size:16px;color:#90e0ef;opacity:0.7;letter-spacing:3px;text-transform:uppercase;">Obstetrics &amp; Labor</div>
<div style="position:absolute;top:130px;left:100px;font-size:52px;font-weight:700;color:#ffffff;line-height:1.15;">Physiology and<br>Management of<br>Normal Labor</div>
<div style="position:absolute;top:340px;left:100px;font-size:18px;color:#90e0ef;opacity:0.8;max-width:500px;">Comprehensive guide covering definition, stages, mechanism,<br>active management, and newborn care</div>
<div style="position:absolute;bottom:60px;left:100px;font-size:14px;color:#90e0ef;opacity:0.5;">Chapter 101 &bull; Normal Labor</div>
<svg style="position:absolute;right:80px;top:50%;transform:translateY(-50%);" width="280" height="280" aria-hidden="true">
<circle cx="140" cy="140" r="130" fill="none" stroke="#00b4d8" stroke-width="2" opacity="0.3"/>
<circle cx="140" cy="140" r="90" fill="none" stroke="#90e0ef" stroke-width="1.5" opacity="0.2"/>
<circle cx="140" cy="140" r="50" fill="#00b4d8" opacity="0.1"/>
<text x="140" y="135" text-anchor="middle" font-family=""Times New Roman", serif" font-size="14" fill="#90e0ef" opacity="0.6">NORMAL</text>
<text x="140" y="155" text-anchor="middle" font-family=""Times New Roman", serif" font-size="14" fill="#90e0ef" opacity="0.6">LABOR</text>
</svg>
</div>
</body>
</html>
