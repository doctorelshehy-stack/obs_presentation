<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; display:flex; justify-content:center; align-items:center; background:#000; }
</style>
<script>
function scaleSlide(){const s=document.querySelector('.slide-content');if(!s)return;const sx=window.innerWidth/960;const sy=window.innerHeight/540;const sc=Math.min(sx,sy);s.style.width='960px';s.style.height='540px';s.style.transform=`scale(${sc})`;s.style.transformOrigin='center center';s.style.flexShrink='0';}
window.addEventListener('load',scaleSlide);window.addEventListener('resize',scaleSlide);
</script>
</head>
<body>
<div class="slide-content" style="width:960px; height:540px; background:#fdf0d5; font-family:'Times New Roman',serif; color:#264653; overflow:hidden;">

<div style="position:absolute; top:24px; left:40px;">
  <p style="font-size:20px; color:#2a9d8f; font-weight:700; margin:0 0 4px 0;">Uterine Curette</p>
  <p style="font-size:14px; color:#264653; margin:0 0 10px 0;">Instruments</p>
  <div style="width:60px; height:3px; background:#e9c46a; margin-bottom:10px;"></div>
</div>
<div style="position:absolute; top:96px; left:40px; right:40px; display:grid; grid-template-columns:1fr 1fr; gap:12px;">
  <div style="background:#ffffff; border-radius:8px; padding:14px 20px; box-shadow:0 2px 8px rgba(0,0,0,0.08);">
    <p style="font-size:15px; color:#264653; font-weight:700; margin:0 0 6px 0;">Types</p>
    <ul style="font-size:14px; color:#264653; margin:0; padding-left:20px; line-height:1.6;">
      <li>Blunt</li>
      <li>Sharp</li>
    </ul>
  </div>
  <div style="display:grid; grid-template-columns:1fr; gap:10px;">
    <div style="background:#ffffff; border-radius:8px; padding:10px 16px; box-shadow:0 2px 8px rgba(0,0,0,0.08);">
      <p style="font-size:15px; color:#2a9d8f; font-weight:700; margin:0 0 4px 0;">Indications</p>
      <ul style="font-size:13px; color:#264653; margin:0; padding-left:18px; line-height:1.5;">
        <li>Evacuation of the uterus in cases of incomplete or missed abortion</li>
        <li>Abnormal uterine bleeding</li>
      </ul>
    </div>
    <div style="background:#ffffff; border-radius:8px; padding:10px 16px; box-shadow:0 2px 8px rgba(0,0,0,0.08);">
      <p style="font-size:15px; color:#e76f51; font-weight:700; margin:0 0 4px 0;">Complications</p>
      <p style="font-size:13px; color:#264653; margin:0;">As uterine sound plus <strong>intestinal injury</strong>.</p>
    </div>
  </div>
</div>


<div style="position:absolute; right:32px; bottom:24px; z-index:100;">
  <svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
    <circle cx="20" cy="20" r="18" fill="#264653" stroke="#2a9d8f" stroke-width="2"/>
    <text x="20" y="26" text-anchor="middle" font-family="Times New Roman, serif" font-size="16" font-weight="700" fill="#ffffff">55</text>
  </svg>
</div>
</div>
</body>
</html>
