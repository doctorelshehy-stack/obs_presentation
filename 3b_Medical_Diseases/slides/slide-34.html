<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; display:flex; justify-content:center; align-items:center; background:#000; }
.slide-content { width:960px; height:540px; position:relative; transform-origin:center center; }
</style>
<script>
function scaleSlide(){const s=document.querySelector('.slide-content');if(!s)return;const sx=window.innerWidth/960;const sy=window.innerHeight/540;const sc=Math.min(sx,sy);s.style.width='960px';s.style.height='540px';s.style.transform=`scale(${sc})`;s.style.transformOrigin='center center';s.style.flexShrink='0';}
window.addEventListener('load',scaleSlide);window.addEventListener('resize',scaleSlide);
</script>
</head>
<body>
<div class="slide-content" style="width:960px;height:540px;background:#edf6f9;overflow:hidden;position:relative;font-family:'Times New Roman',serif;">
<svg style="position:absolute;right:32px;bottom:24px;width:48px;height:32px;z-index:100;" aria-hidden="true">
  <rect x="0" y="0" width="48" height="28" rx="6" fill="#2a9d8f" />
  <text x="24" y="20" text-anchor="middle" font-family="Times New Roman,serif" font-size="16" font-weight="700" fill="#ffffff">34</text>
</svg>
<svg style="position:absolute;top:0;left:0;width:960px;height:540px;z-index:0;" aria-hidden="true">
  <rect x="0" y="0" width="960" height="540" fill="#264653" />
  <rect x="0" y="0" width="960" height="540" fill="url(#sdGrad)" opacity="0.3" />
  <defs><linearGradient id="sdGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#e9c46a" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#2a9d8f" stop-opacity="0.15"/>
  </linearGradient></defs>
  <rect x="80" y="140" width="4" height="260" fill="#e9c46a" />
</svg>
<div style="position:absolute;top:160px;left:120px;z-index:10;">
  <p style="font-size:80px;font-weight:700;color:#e9c46a;font-family:'Times New Roman',serif;margin:0;opacity:0.6;">04</p>
  <p style="font-size:40px;font-weight:700;color:#ffffff;font-family:'Times New Roman',serif;margin:8px 0 0 0;">Thromboembolism during Pregnancy</p>
  <div style="width:80px;height:4px;background:#2a9d8f;border-radius:2px;margin-top:14px;"></div>
  <p style="font-size:18px;color:#edf6f9;font-family:'Times New Roman',serif;margin:12px 0 0 0;opacity:0.7;">DVT, Thrombophlebitis & Pulmonary Embolism</p>
</div>
</div>
</body>
</html>
