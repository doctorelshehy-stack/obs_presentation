<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; display:flex; justify-content:center; align-items:center; background:#000; }
.slide-content { width:960px; height:540px; position:relative; transform-origin:center center; }
</style>
<script>
function scaleSlide(){const s=document.querySelector('.slide-content');if(!s)return;const sx=window.innerWidth/960;const sy=window.innerHeight/540;const sc=Math.min(sx,sy);s.style.width='960px';s.style.height='540px';s.style.transform='scale('+sc+')';s.style.transformOrigin='center center';s.style.flexShrink='0';}
window.addEventListener('load',scaleSlide);window.addEventListener('resize',scaleSlide);
</script>
</head>
<body>
<div class="slide-content" style="width:960px;height:540px;background:#264653;font-family:'Times New Roman',serif;overflow:hidden;">
<div style="position:absolute;top:0;left:0;width:960px;height:540px;background:#264653;"></div>
<div style="position:absolute;top:20px;left:60px;z-index:10;">
  <p style="font-size:32px;color:#ffffff;font-weight:700;margin:0;">Table of Contents</p>
  <div style="width:60px;height:4px;background:#2a9d8f;margin:8px 0 25px 0;"></div>
</div>
<div style="position:absolute;top:80px;left:60px;right:60px;z-index:10;">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px 30px;">
    <div style="display:flex;align-items:center;gap:12px;padding:8px 12px;background:rgba(42,157,143,0.15);border-radius:4px;border-left:3px solid #2a9d8f;">
      <span style="font-size:20px;font-weight:700;color:#e9c46a;min-width:28px;">01</span>
      <span style="font-size:18px;color:#ffffff;">Brow Presentation</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;padding:8px 12px;background:rgba(42,157,143,0.15);border-radius:4px;border-left:3px solid #2a9d8f;">
      <span style="font-size:20px;font-weight:700;color:#e9c46a;min-width:28px;">02</span>
      <span style="font-size:18px;color:#ffffff;">Compound Presentation</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;padding:8px 12px;background:rgba(42,157,143,0.15);border-radius:4px;border-left:3px solid #2a9d8f;">
      <span style="font-size:20px;font-weight:700;color:#e9c46a;min-width:28px;">03</span>
      <span style="font-size:18px;color:#ffffff;">Breech Presentation</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;padding:8px 12px;background:rgba(42,157,143,0.15);border-radius:4px;border-left:3px solid #2a9d8f;">
      <span style="font-size:20px;font-weight:700;color:#e9c46a;min-width:28px;">04</span>
      <span style="font-size:18px;color:#ffffff;">Shoulder Presentation (Transverse Lie)</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;padding:8px 12px;background:rgba(42,157,143,0.15);border-radius:4px;border-left:3px solid #2a9d8f;">
      <span style="font-size:20px;font-weight:700;color:#e9c46a;min-width:28px;">05</span>
      <span style="font-size:18px;color:#ffffff;">Cord Presentation and Prolapse</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;padding:8px 12px;background:rgba(42,157,143,0.15);border-radius:4px;border-left:3px solid #2a9d8f;">
      <span style="font-size:20px;font-weight:700;color:#e9c46a;min-width:28px;">06</span>
      <span style="font-size:18px;color:#ffffff;">Shoulder Dystocia</span>
    </div>
  </div>
</div>
<svg style="position:absolute;right:32px;bottom:24px;width:40px;height:32px;z-index:100;" aria-hidden="true">
  <rect x="0" y="0" width="40" height="32" rx="4" fill="#2a9d8f"/>
  <text x="20" y="22" font-family="Times New Roman,serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
</svg>
</div>
</body>
</html>
