<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; display:flex; justify-content:center; align-items:center; background:#000; }
.slide-content { width:960px; height:540px; position:relative; transform-origin:center center; }
</style>
<script>
function scaleSlide(){const s=document.querySelector('.slide-content');if(!s)return;const sx=window.innerWidth/960;const sy=window.innerHeight/540;const sc=Math.min(sx,sy);s.style.width='960px';s.style.height='540px';s.style.transform='scale('+sc+')';s.style.transformOrigin='center center';s.style.flexShrink='0';}
window.addEventListener('load',scaleSlide);window.addEventListener('resize',scaleSlide);
</script>
</head>
<body>
<div class="slide-content" style="width:960px;height:540px;background:#264653;font-family:'Times New Roman',serif;overflow:hidden;">
<div style="position:absolute;top:0;left:0;width:960px;height:540px;background:#264653;"></div>
<div style="position:absolute;top:0;left:0;width:30px;height:540px;background:#2a9d8f;"></div>
<div style="position:absolute;bottom:0;left:0;width:960px;height:100px;background:#2a9d8f;"></div>
<svg style="position:absolute;top:-60px;right:-80px;width:500px;height:400px;z-index:1;" aria-hidden="true">
  <ellipse cx="250" cy="200" rx="200" ry="300" fill="#2a9d8f" opacity="0.3"/>
</svg>
<div style="position:absolute;top:120px;left:70px;z-index:10;">
  <div style="width:80px;height:5px;background:#e9c46a;margin-bottom:15px;"></div>
  <p style="font-size:28px;color:#e9c46a;margin:0;font-weight:400;letter-spacing:3px;">OBSTETRICS</p>
  <p style="font-size:64px;color:#ffffff;margin:8px 0 0 0;font-weight:700;line-height:1.1;">MALPRESENTATIONS</p>
  <p style="font-size:52px;color:#f4a261;margin:4px 0 0 0;font-weight:700;">OF LABOR</p>
  <div style="width:60px;height:4px;background:#e9c46a;margin:20px 0 15px 0;"></div>
  <p style="font-size:24px;color:#ffffff;margin:0;font-weight:400;">Brow · Compound · Breech · Shoulder</p>
  <p style="font-size:24px;color:#ffffff;margin:4px 0 0 0;font-weight:400;">Cord Prolapse · Shoulder Dystocia</p>
</div>
<div style="position:absolute;bottom:25px;left:70px;z-index:10;">
  <p style="font-size:18px;color:#edf6f9;margin:0;opacity:0.9;">Obstetrics &amp; Gynecology Lecture Series</p>
  <p style="font-size:16px;color:#edf6f9;margin:2px 0 0 0;opacity:0.7;">Normal &amp; Abnormal Labor Module</p>
</div>
<svg style="position:absolute;right:32px;bottom:24px;width:40px;height:32px;z-index:100;" aria-hidden="true">
  <rect x="0" y="0" width="40" height="32" rx="4" fill="#2a9d8f"/>
  <text x="20" y="22" font-family="Times New Roman,serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
</svg>
</div>
</body>
</html>
